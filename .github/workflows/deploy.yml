name: Build & Deploy React App via SSH & Docker

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v3

      - name: 🐳 Build Docker image
        run: |
          docker build --build-arg VITE_URL=${{ secrets.VITE_URL }} --build-arg VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }} -t orarimed-front .

      - name: 📦 Save image to tarball
        run: docker save orarimed-front -o orarimed-front.tar

      - name: 🗝️ Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: 📤 Copy Docker image to server
        run: scp -o StrictHostKeyChecking=no orarimed-front.tar ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/orarimed-front.tar

      - name: 🚀 Deploy Docker container on server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            docker load -i /tmp/orarimed-front.tar &&
            docker stop orarimed-front || true &&
            docker rm orarimed-front || true &&
            docker run -d --name orarimed-front -p 3007:80 orarimed-front &&
            rm /tmp/orarimed-front.tar
          "
