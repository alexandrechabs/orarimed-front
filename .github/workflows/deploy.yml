name: Deploy to Production

on:
  push:
    branches: [main] # Déclenche le déploiement sur push sur main
  workflow_dispatch: # Permet de déclencher manuellement depuis l'interface GitHub

env:
  IMAGE_NAME: orarimed-front
  CONTAINER_NAME: orarimed-front
  PORT: 3007

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Configuration de Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login à Docker Hub (si vous utilisez un registre privé)
      # - name: Login to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Construire et pousser l'image Docker
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false # Ne pousse pas l'image par défaut
          tags: ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Arrêter et supprimer le conteneur existant s'il est en cours d'exécution
      - name: Stop and remove existing container
        run: |
          if [ $(docker ps -q -f name=${{ env.CONTAINER_NAME }}) ]; then
              docker stop ${{ env.CONTAINER_NAME }}
              docker rm ${{ env.CONTAINER_NAME }}
          fi

      # Démarrer le nouveau conteneur
      - name: Run Docker container
        run: |
          docker run -d \
            --name ${{ env.CONTAINER_NAME }} \
            -p ${{ env.PORT }}:3007 \
            --restart unless-stopped \
            ${{ env.IMAGE_NAME }}:latest

      # Nettoyer les images non utilisées
      - name: Clean up
        run: |
          docker system prune -f
